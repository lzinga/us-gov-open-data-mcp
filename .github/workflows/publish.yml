name: Publish to npm, GitHub Packages & the MCP Registry

# Triggers when you publish a GitHub Release (from draft → published).
#
# npm uses trusted publishing (OIDC): no NPM_TOKEN secret. The package's
# trusted publisher on npmjs.com must name this repository and the workflow
# file "publish.yml" (environment "npm"). Provenance is attached automatically.
# The MCP Registry also takes a GitHub OIDC login, so it needs no secret either.
on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Build and test once, without any publish credentials, and hand the exact
  # tarballs to the publish jobs so no dependency code runs next to the OIDC token.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Check server.json matches package.json
        run: node scripts/server-json.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test # pretest builds

      - name: Validate the MCP Registry listing
        run: |
          bash scripts/install-mcp-publisher.sh
          ./mcp-publisher validate
          rm mcp-publisher

      - name: Pack for npm
        run: |
          mkdir -p out/npm out/github
          npm pack --ignore-scripts --pack-destination out/npm

      - name: Pack for GitHub Packages (@lzinga scope)
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'fs';
            const pkg = JSON.parse(readFileSync('package.json', 'utf-8'));
            pkg.name = '@lzinga/us-gov-open-data-mcp';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm pack --ignore-scripts --pack-destination out/github

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: out/npm/*.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-package
          path: out/github/*.tgz
          if-no-files-found: error

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing + provenance
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check npm supports trusted publishing (>= 11.5.1)
        run: |
          NPM_VERSION=$(npm --version)
          node -e "
            const [a, b, c] = process.argv[1].split('.').map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) process.exit(1);
          " "$NPM_VERSION" || { echo "::error::npm $NPM_VERSION is too old for trusted publishing (needs 11.5.1+)"; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Publish to npm
        run: npm publish ./package/*.tgz --provenance --access public

  publish-github:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lzinga'
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-package
          path: package

      - name: Publish to GitHub Packages
        # GitHub Packages has no OIDC publishing; the job-scoped GITHUB_TOKEN is used.
        run: npm publish ./package/*.tgz # zizmor: ignore[use-trusted-publishing]
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-registry:
    # List the release in the official MCP Registry as
    # io.github.lzinga/us-gov-open-data-mcp. The registry checks the npm
    # package's mcpName, so this runs once npm has the new version.
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the registry; no secret needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install mcp-publisher
        run: bash scripts/install-mcp-publisher.sh

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        # npm can take a moment to serve a just-published version.
        run: |
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "Attempt $attempt failed; retrying in 30s."
            sleep 30
          done
          exit 1
